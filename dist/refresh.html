<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>Updating HajCare AI…</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8faf8; color: #0a4a32; font: 16px system-ui, sans-serif; }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      .spinner { width: 2.5rem; height: 2.5rem; margin: 0 auto 1rem; border: 4px solid #d6e7de; border-top-color: #0a6b45; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      a { color: #0a6b45; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Updating HajCare AI</h1>
      <p id="status">Removing the old app cache and opening the latest version…</p>
      <p><a href="/home?release=2026-07-16-4">Open latest HajCare AI</a></p>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
          }
          document.getElementById("status").textContent = "Latest version is ready. Opening HajCare AI…";
          window.location.replace("/home?release=2026-07-16-4");
        } catch {
          document.getElementById("status").textContent = "Please use the link below to open the latest version.";
        }
      })();
    </script>
  </body>
</html>
